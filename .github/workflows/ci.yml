name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile wasmJs
        run: ./gradlew :emojislider:compileKotlinWasmJs :example:compileKotlinWasmJs --stacktrace --no-daemon

      - name: Test
        run: ./gradlew :emojislider:desktopTest --stacktrace --no-daemon

      - name: Spotless check
        run: ./gradlew :emojislider:spotlessCheck --stacktrace --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emojislider-test-reports
          path: |
            emojislider/build/reports/tests/**
            emojislider/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
